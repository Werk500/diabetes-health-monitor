apiVersion: v1
kind: ConfigMap
metadata:
  name: diabetes-config
  namespace: diabetes-monitor
data:
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: prod
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: root
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  APP_EXPORT_DIR: /app/exports
  CORS_ALLOWED_ORIGINS: http://localhost:30080
  REFRESH_COOKIE_SECURE: "false"
