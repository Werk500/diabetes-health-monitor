apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-backend
  namespace: diabetes-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diabetes-backend
  template:
    metadata:
      labels:
        app: diabetes-backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo waiting-for-mysql; sleep 2; done; until nc -z redis 6379; do echo waiting-for-redis; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: backend
          image: diabetes-monitor-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: diabetes-config
            - secretRef:
                name: diabetes-secrets
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          volumeMounts:
            - name: export-storage
              mountPath: /app/exports
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: export-storage
          persistentVolumeClaim:
            claimName: backend-exports
        - name: logs
          emptyDir: {}
