apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-frontend
  namespace: diabetes-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diabetes-frontend
  template:
    metadata:
      labels:
        app: diabetes-frontend
    spec:
      containers:
        - name: frontend
          image: diabetes-monitor-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
